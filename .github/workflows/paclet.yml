name: paclet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the generator's pinned dependencies
        run: python -m pip install --require-hashes --requirement Tools/requirements.lock
      - name: Generated kernel tables match the contract
        run: python Tools/generate.py --check
      - name: Generator tests
        run: python -m pytest Tools/tests -m "not wolfram"

  paclet:
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      # A Wolfram Engine entitlement for CI, created with CreateLicenseEntitlement.
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
    steps:
      - name: Require the Wolfram Engine entitlement
        run: |
          if [ -z "$WOLFRAMSCRIPT_ENTITLEMENTID" ]; then
            echo "::error::The WOLFRAMSCRIPT_ENTITLEMENTID repository secret is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check, test, and build the paclet
        env:
          SYNTHYRALINK_BUILD_DIRECTORY: ${{ runner.temp }}/synthyralink-build
        run: wolframscript -file Tools/PacletCI.wls
      - name: Install the archive in a clean kernel and replay the demo
        env:
          SYNTHYRALINK_BUILD_DIRECTORY: ${{ runner.temp }}/synthyralink-build
        run: |
          SYNTHYRALINK_PACLET_ARCHIVE="$(ls "$SYNTHYRALINK_BUILD_DIRECTORY"/*.paclet)" \
            wolframscript -file Tools/CleanInstallSmoke.wls
      - uses: actions/upload-artifact@v4
        with:
          name: paclet
          path: ${{ runner.temp }}/synthyralink-build/*.paclet
